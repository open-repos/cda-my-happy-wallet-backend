image: node:22-bookworm

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - validate
  - test
  - build
  - package
  - deploy

.branch_or_merge_request:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

.npm_job:
  extends: .branch_or_merge_request
  before_script:
    - npm ci --cache .npm --prefer-offline

quality:
  stage: validate
  extends: .npm_job
  script:
    - npm run format
    - npm run lint

tests:
  stage: test
  extends: .npm_job
  services:
    - name: mysql:8.0
      alias: my-happy-wallet-mysql-test
  variables:
    NODE_ENV: test
    MYSQL_DATABASE: myhappywallet_test
    MYSQL_USER: myhappywallet_test
    MYSQL_PASSWORD: test-password
    MYSQL_ROOT_PASSWORD: test-root-password
    DATABASE_URL: mysql://myhappywallet_test:test-password@my-happy-wallet-mysql-test:3306/myhappywallet_test
    SHADOW_DATABASE_URL: mysql://myhappywallet_test:test-password@my-happy-wallet-mysql-test:3306/myhappywallet_test_shadow
    ACCESS_TOKEN: test-access-token-secret-at-least-32-characters
    REFRESH_TOKEN: test-refresh-token-secret-at-least-32-characters
    REGISTER_TOKEN: test-register-token-secret-at-least-32-characters
    MAILER_DRIVER: smtp
    SMTP_HOST: localhost
    SMTP_PORT: "1025"
    SMTP_SECURE: "false"
    EMAIL_SENDER: no-reply@myhappywallet.local
  before_script:
    - npm ci --cache .npm --prefer-offline
    - until node -e "const net=require('net');const socket=net.connect(3306,'my-happy-wallet-mysql-test',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"; do sleep 2; done
    - npm run db:deploy
  needs:
    - quality
  script:
    - npm run type-check
    - npm run test:services
    - npm run test:mailer
    - npm run test:smtp-mailer
    - npm run test:create-user
    - npm run test:token-service
    - npm run test:native-session
    - npm run test:renew-session
    - npm run test:health
    - npm run test:delete-revenu-route
    - npm run test:operations-domain
    - npm run test:operations-migration
    - npm run test:operations-schema
    - npm run test:operations-use-cases
    - npm run test:operations-repositories
    - npm run test:operations-api
    - npm run test:prisma-errors
    - npm run test:result-construction
    - npm run test:repositories
    - npm run test:api

build:
  stage: build
  extends: .npm_job
  needs:
    - quality
    - tests
  script:
    - npm run prisma:generate
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

container_image:
  stage: package
  extends: .branch_or_merge_request
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  cache: []
  needs:
    - job: build
      artifacts: false
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - REGISTRY_AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$REGISTRY_AUTH" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --import-cache type=registry,ref="$CI_REGISTRY_IMAGE:buildcache" --export-cache type=registry,ref="$CI_REGISTRY_IMAGE:buildcache",mode=max --output type=image,name="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA",push=true

deploy_production:
  stage: deploy
  image: debian:bookworm-slim
  interruptible: false
  timeout: 15m
  resource_group: backend-production
  tags:
    - server_runner
  cache: []
  needs:
    - job: container_image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  environment:
    name: production
    deployment_tier: production
  before_script:
    - test -s "$SSH_PRIVATE_KEY"
    - test -s "$SSH_KNOWN_HOSTS"
    - test -n "$SERVER_IP"
    - test -n "$SERVER_USER"
    - apt-get update && apt-get install --yes --no-install-recommends openssh-client
    - install -d -m 700 ~/.ssh
    - chmod 400 "$SSH_PRIVATE_KEY"
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - ssh -i "$SSH_PRIVATE_KEY" -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_IP" "sudo -n /usr/local/sbin/deploy-mhw-backend '$CI_COMMIT_SHA'"
