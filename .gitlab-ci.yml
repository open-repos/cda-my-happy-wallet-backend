image: node:16.8.0

stages:
  - build_stage
  - deploy_stage

.before_script_template:
  before_script:
    - echo "====== Pre script ======"
    - ls -a
    - echo "$CI_COMMIT_BRANCH" && echo "$CI_PIPELINE_SOURCE" && echo "$CI_COMMIT_TAG"
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 700 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -t rsa 64.227.1.160 > ~/.ssh/known_hosts
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 644 ~/.ssh/known_hosts
    - ls -la
# .base-rules:
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "develop"'
#       when: always
#     - if: '$CI_PIPELINE_SOURCE == "push"'
#       when: never
#     - if: $CI_COMMIT_TAG
#       when: never

cache: &global_cache
  key: $CI_COMMIT_REF_SLUG
  policy: pull-push
  paths:
    - node_modules/
    - package-lock.json

build:
  stage: build_stage
  extends: .before_script_template
  rules: 
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" ' 
      when: always
    - if: '$CI_COMMIT_BRANCH != "develop" || $CI_COMMIT_BRANCH != "main" ' 
      when: never
    - when: on_success
  script:
    - "node --version"
    - ls -a
    - npm i
    - npm run build
  cache:
    <<: *global_cache
    policy: push
  tags:
    - server_runner

deploy:
  image: keymetrics/pm2:6
  stage: deploy_stage
  extends: .before_script_template
  rules: 
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: never
    - when: on_success
  script:
      # Delploy
    - echo "====== Deploy to production server ======"
    - echo "Setup tagget server directories"
    # - pm2 deploy ecosystem.config.js production setup 2>&1 || true
    # - echo "make deploy"
    # - pm2 deploy ecosystem.config.js production
    # - "pm2 startOrGracefulReload ecosystem.config.js --env production && pm2 save"
    - pm2 start ecosystem.config.js --only myhappywallet
  cache:
    <<: *global_cache
    policy: pull
  tags:
    - server_runner
