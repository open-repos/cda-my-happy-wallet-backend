name: Bug report
description: Report backend behavior that differs from the expected contract.
title: "[Bug]: "
labels:
  - bug
  - status/backlog
projects:
  - open-repos/2
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication and accounts
        - Operations and budget
        - API and validation
        - Database and migrations
        - Infrastructure and delivery
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include the status code and a sanitized response or log when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the API or domain have done?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the application version and environment without sharing credentials or production data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized requests, responses, logs, or related links. Never include secrets or private user data.
