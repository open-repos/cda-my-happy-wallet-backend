name: Feature
description: Propose a backend capability or API improvement.
title: "[Feature]: "
labels:
  - enhancement
  - status/backlog
projects:
  - open-repos/2
body:
  - type: markdown
    attributes:
      value: Describe the result from the user's or API consumer's point of view. Keep implementation choices for the solution section.
  - type: textarea
    id: need
    attributes:
      label: User or API need
      description: Who needs this and what should become possible?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result
      description: Describe the observable API or domain behavior after delivery.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication and accounts
        - Operations and budget
        - API and validation
        - Database and migrations
        - Infrastructure and delivery
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add concrete, testable completion criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution notes
      description: Add API contracts, security constraints, dependencies, or an implementation direction when known.
  - type: input
    id: version
    attributes:
      label: Target version or milestone
      description: Leave empty if prioritization has not been decided.
