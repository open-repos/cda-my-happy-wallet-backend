services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must reference an immutable image tag}
    env_file:
      - ${BACKEND_ENV_FILE:-/etc/myhappywallet-backend/backend.env}
    ports:
      - "127.0.0.1:4201:4201"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4201/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
